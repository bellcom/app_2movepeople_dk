bc_2movepeople.main:
  path: '/admin/bc_2movepeople'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: '2Movepeople configuration'
  requirements:
    _permission: 'administer bc_2movepeople settings'

bc_2movepeople.config:
  path: '/admin/config/bc_2movepeople/config'
  defaults:
    _form: '\Drupal\bc_2movepeople\Form\ConfigForm'
    _title: '2Movepeople Configuration form'
  requirements:
    _permission: 'administer bc_2movepeople settings'
  options:
    _admin_route: TRUE

bc_2movepeople.user_edit:
  path: '/user_edit/{user}'
  defaults:
    _controller: '\Drupal\bc_2movepeople\Controller\MovepeopleController::user_edit'
    _title: 'Edit profile'
  requirements:
    _permission: 'access content'
    user: '^[0-9]+'