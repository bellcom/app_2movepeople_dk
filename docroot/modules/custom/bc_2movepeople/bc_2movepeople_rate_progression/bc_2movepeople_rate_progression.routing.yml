bc_2movepeople_rate_progression.rates_add:
  path: '/rates/{progression_target_id}/add'
  options:
    parameters:
      progression_target_id:
        type: entity:node
  defaults:
    _title_callback: '\Drupal\bc_2movepeople_rate_progression\Form\UserRatesAddForm:getTitle'
    _form: '\Drupal\bc_2movepeople_rate_progression\Form\RateAddForm'
    node: null
  requirements:
    _permission: 'access progression rates'
    progression_target_id: \d+

bc_2movepeople_rate_progression.feedback_add:
  path: '/feedback/add'
  defaults:
    _title: 'Dialogue rating'
    _controller: '\Drupal\bc_2movepeople_rate_progression\Controller\RateController::dialogueRate'
  requirements:
    _permission: 'access provide feedback'

bc_2movepeople_rate_progression.user_rates_add:
  path: '/rates/user/{user}/add'
  options:
    parameters:
      user:
        type: entity:user
  defaults:
    _title_callback: '\Drupal\bc_2movepeople_rate_progression\Form\UserRatesAddForm:getTitle'
    _form: '\Drupal\bc_2movepeople_rate_progression\Form\UserRatesAddForm'
  requirements:
    _permission: 'access progression rates'
    user: \d+

bc_2movepeople_rate_progression.self_rates_add:
  path: '/rates/add'
  defaults:
    _title_callback: '\Drupal\bc_2movepeople_rate_progression\Controller\RateController::selfRateTitle'
    _controller: '\Drupal\bc_2movepeople_rate_progression\Controller\RateController::selfRate'
  requirements:
    _user_is_logged_in: 'TRUE'

bc_2movepeople_rate_progression.rates.get:
  path: '/rates/{progression_target_id}/get'
  defaults:
    _controller: '\Drupal\bc_2movepeople_rate_progression\Controller\RateController::rateGet'
    _title: ''
  requirements:
    _permission: 'access progression rates'
    _method: 'GET'
