bc_2movepeople_questionmaker:
  path: 'bc_2movepeople/questionmaker'
  defaults:
    _controller: '\Drupal\bc_2movepeople\Controller\QuestionMakerController::content'
    _title: 'Questionmaker'
  requirements:
    _permission: 'access content'

bc_2movepeople_dashboard:
  path: 'bc_2movepeople/dashboard'
  defaults:
    _controller: '\Drupal\bc_2movepeople_dashboard\Controller\MovepeopleDashboardController::getJsAccordionImplementation'
    _title: 'Dashboard'
  requirements:
    _user_is_logged_in: 'TRUE'

bc_2movepeople.admin_settings_form:
  path: '/admin/config/bc_2movepeople/account'
  defaults:
    _form: '\Drupal\bc_2movepeople\Form\AdminSettingsForm'
    _title: '2 Move People settings form'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE

bc_2movepeople.admin_settings_form:
  path: '/admin/config/bc_2movepeople/administration'
  defaults:
    _form: '\Drupal\bc_2movepeople\Form\AdminSettingsForm'
    _title: '2 Move People settings form'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE

bc_2movepeople.admin_settings_form:
  path: '/admin/config/bc_2movepeople/progressions'
  defaults:
    _form: '\Drupal\bc_2movepeople\Form\AdminSettingsForm'
    _title: '2 Move People settings form'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE

bc_2movepeople_admin_settings_form:
  path: '/admin/config/bc_2movepeople/adminsettings'
  defaults:
    _form: '\Drupal\bc_2movepeople\Form\AdminSettingsForm'
    _title: '2 Move People settings form'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE

