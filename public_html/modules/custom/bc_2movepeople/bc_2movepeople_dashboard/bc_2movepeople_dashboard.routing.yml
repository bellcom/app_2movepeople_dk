bc_2movepeople_dashboard.dashboard:
  path: '/dashboard'
  defaults:
    _title: 'Clients'
    _controller: '\Drupal\bc_2movepeople_dashboard\Controller\MovepeopleDashboardController::getClientsImplementation'
  requirements:
    _user_is_logged_in: 'TRUE'

bc_2movepeople_dashboard.user.overview:
  path: '/dashboard/users/{user}/overview'
  defaults:
    _title: 'User overview'
    _controller: '\Drupal\bc_2movepeople_dashboard\Controller\MovepeopleDashboardController::getUserOverviewImplementation'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

bc_2movepeople_dashboard.user.progressions:
  path: '/dashboard/users/{user}/progressions'
  defaults:
    _title: 'User progressions'
    _controller: '\Drupal\bc_2movepeople_dashboard\Controller\MovepeopleDashboardController::getJsAccordionImplementation'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

bc_2movepeople_dashboard.user.milestones:
  path: '/dashboard/users/{user}/milestones'
  defaults:
    _title: 'Dashboard'
    _controller: '\Drupal\bc_2movepeople_dashboard\Controller\MovepeopleDashboardController::getMilestoneJsAccordionImplementation'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

bc_2movepeople_dashboard.user.progressions.add:
  path: '/dashboard/users/{user}/progressions/add'
  options:
    parameters:
      user:
        type: entity:user
  defaults:
    _title: 'Add new progression'
    _form: '\Drupal\bc_2movepeople_dashboard\Form\ProgressionAddForm'
  requirements:
    _permission: 'access content'

bc_2movepeople_dashboard.user.milestones.add:
  path: '/dashboard/users/{user}/milestones/add'
  options:
    parameters:
      user:
        type: entity:user
  defaults:
    _title: 'Add new milestone'
    _form: '\Drupal\bc_2movepeople_dashboard\Form\MilestoneAddForm'
  requirements:
    _permission: 'access content'

bc_2movepeople_dashboard.milestone.tasks.add:
  path: '/dashboard/milestones/{node}/tasks/add'
  options:
    parameters:
      node:
        type: entity:node
  defaults:
    _title: 'Add new milestone task'
    _form: '\Drupal\bc_2movepeople_dashboard\Form\MilestoneTaskEditForm'
  requirements:
    _permission: 'access content'

bc_2movepeople_dashboard.user.tasks:
  path: '/dashboard/users/{user}/tasks'
  options:
    parameters:
      user:
        type: entity:user
  defaults:
    _title: "User's tasks"
    _controller: '\Drupal\bc_2movepeople_dashboard\Controller\MovepeopleDashboardController::getUserTasks'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

bc_2movepeople_dashboard.user.task.complete:
  path: '/dashboard/users/{user}/tasks/{node}/complete'
  options:
    parameters:
      user:
        type: entity:user
      node:
        type: entity:node
  defaults:
    _title: "Task complete"
    _form: '\Drupal\bc_2movepeople_dashboard\Form\UserTaskCompleteForm'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

bc_2movepeople_dashboard.admin.settings_form:
  path: '/admin/config/bc_2movepeople_dashboard/settings'
  defaults:
    _form: '\Drupal\bc_2movepeople_dashboard\Form\AdminSettingsForm'
    _title: '2Move People settings form'
  requirements:
    _permission: 'access administration pages'
  options:
    _admin_route: TRUE